<section class="hero" data-section="home"><div class="hero-copy"><p class="eyebrow">АУДИТ · ПОДАТКИ · ПРАВНИЧА ДОПОМОГА</p><h1>Розуміти цифри.<br/><em>Бачити рішення.</em></h1><p class="lead">Аудит фінансової звітності, податкове консультування та правнича допомога бізнесу й організаціям по всій Україні.</p><div class="hero-actions"><button class="action" data-go="contact">Обговорити завдання ↗</button><button class="text-action" data-go="services">Переглянути послуги ↓</button></div><p class="geography">Суми · працюємо по всій Україні · виїзд до клієнта</p></div><aside class="hero-aside"><p class="eyebrow">З ЯКИМ ЗАВДАННЯМ ВИ ЗВЕРТАЄТЕСЯ?</p><button data-service="audit">Потрібен аудит звітності <span>↗</span></button><button data-service="grant">Потрібна перевірка грантового проєкту <span>↗</span></button><button data-service="due">Плануємо придбати бізнес <span>↗</span></button><button data-service="protection">Захист та представництво <span>↗</span></button><button data-service="diia">Готуємо звіт резидента Дія.City <span>↗</span></button></aside></section>
<div class="trust"><span>Реєстр аудиторів та Суб’єктів аудиторської діяльності <strong>№ 4808</strong></span><span class="registry-status">Включено до розділу «Суб’єкти аудиторської діяльності, які мають право проводити обов’язковий аудит фінансової звітності» Реєстру аудиторів та суб’єктів аудиторської діяльності</span><span>Команда <strong>аудиторів та адвокат</strong></span></div>
<section class="section services" data-section="services"><div class="section-heading"><div><p class="eyebrow">НАША ЕКСПЕРТИЗА</p><h2>Послуги для ваших завдань</h2></div><p>Від перевірки звітності до супроводу важливих рішень. Оберіть напрям, щоб дізнатися більше.</p></div><div class="service-grid">
<article class="service-group"><div class="group-heading"><span class="group-label">01 / Довіра до звітності</span><h3>Аудит і перевірки</h3></div>
<details data-id="audit"><summary>Обов’язковий та ініціативний аудит</summary><p>Перевірка фінансової звітності з наданням аудиторського звіту. Обсяг і строки погоджуємо з урахуванням підприємства та його звітності.</p><button data-go="contact">Обговорити аудит ↗</button></details>
<details data-id="diia"><summary>Перевірка звітів резидентів Дія.City</summary><p>Маємо досвід виконання завдань для резидентів Дія.City. Погоджуємо предмет перевірки, необхідні документи та строки підготовки звіту.</p><button data-go="contact">Обговорити перевірку ↗</button></details>
<details data-id="grant"><summary>Перевірка дотримання грантових угод</summary><p>Досвід перевірок проєктів, зокрема за підтримки Міжнародного Вишеградського фонду та Українського культурного фонду. Враховуємо умови угоди та вимоги донора до завдання і звіту.</p><button data-go="contact">Обговорити проєкт ↗</button></details>
<details><summary>Огляд фінансової звітності</summary><p>Огляд звітності як окреме завдання з надання обмеженої впевненості. Період, предмет та умови завдання визначаємо до початку роботи.</p><button data-go="contact">Обговорити завдання ↗</button></details>
<details><summary>Узгоджені процедури</summary><p>Виконуємо погоджені процедури щодо визначених даних, документів або операцій. Результат — звіт про фактичні результати виконаних процедур.</p><button data-go="contact">Обговорити процедури ↗</button></details></article>
<article class="service-group"><div class="group-heading"><span class="group-label">02 / Зрозумілі фінанси</span><h3>Звітність і податки</h3></div>
<details><summary>Трансформація звітності за МСФЗ</summary><p>Трансформація фінансової звітності з НП(С)БО у МСФЗ. Підготовка повного комплекту фінансової звітності, включно з примітками.</p><button data-go="contact">Обговорити трансформацію ↗</button></details>
<details><summary>Трансфертне ціноутворення — ТЦУ</summary><p>Комплекс послуг відповідно до завдання клієнта. Склад робіт із документацією, звітністю та супроводом погоджуємо індивідуально.</p><button data-go="contact">Обговорити ТЦУ ↗</button></details>
<details><summary>Контрольовані іноземні компанії — КІК</summary><p>Консультування, підготовка документів і звітності та супровід за погодженим завданням клієнта.</p><button data-go="contact">Обговорити КІК ↗</button></details>
<details><summary>Податкове консультування та перевірка ризиків</summary><p>Аналіз податкових питань, операцій і звітності. Визначення ризиків та підготовка рекомендацій щодо їх врегулювання.</p><button data-go="contact">Обговорити питання ↗</button></details></article>
<article class="service-group"><div class="group-heading"><span class="group-label">03 / Обґрунтовані рішення</span><h3>Контроль і правнича допомога</h3></div>
<details data-id="due"><summary>Перевірка бізнесу перед придбанням або інвестуванням</summary><p>Фінансова, податкова та юридична перевірка бізнесу — Due Diligence. Аналіз активів, зобов’язань, договорів і ризиків для рішення щодо угоди.</p><p><strong>Результат:</strong> звіт із виявленими ризиками та висновками в межах погодженого завдання.</p><button data-go="contact">Обговорити майбутню угоду ↗</button></details>
<details><summary>Внутрішній аудит і оцінка внутрішнього контролю</summary><p>Аналіз процесів та контрольних процедур підприємства, визначення слабких місць і рекомендації керівництву.</p><button data-go="contact">Обговорити завдання ↗</button></details>
<details><summary>Супровід податкових перевірок</summary><p>Допомога під час підготовки та проходження перевірки, опрацювання запитів і матеріалів контролюючого органу.</p><button data-go="contact">Обговорити супровід ↗</button></details>
<details><summary>Представництво в судах і контролюючих органах</summary><p>Правнича допомога та представлення інтересів відповідно до обставин справи й погодженого обсягу роботи.</p><button data-go="contact">Обговорити справу ↗</button></details></article>
</div></section>
<section class="section about" data-section="about"><div><p class="eyebrow">ПРО ФІРМУ</p><h2>Знаємо контекст<br/>вашої діяльності</h2><p>Працюємо з підприємствами, громадськими й неприбутковими організаціями, медичними та навчальними закладами.</p><p>Маємо досвід перевірки звітів резидентів Дія.City та підтвердження відповідності використання грантових коштів умовам угод, зокрема у проєктах за підтримки Міжнародного Вишеградського фонду та Українського культурного фонду.</p></div><div class="sectors"><h3>Галузевий досвід</h3><p>Машинобудування · легка промисловість · сільське господарство · харчова та переробна промисловість · транспорт · добувна промисловість · енергетика · будівництво</p><div class="sector-note">Окремий фокус — громадські та неприбуткові організації, освіта й медицина.</div></div></section>
<section class="section credentials"><p class="eyebrow">ПРОФЕСІЙНІ ВІДОМОСТІ</p><h2>Реєстрація, якість і відповідальність</h2><div class="credentials-grid"><article><h3>ТОВ &quot;АФ &quot;МРІЯ-АУДИТ&quot; внесено в Реєстр аудиторів та суб'єктів аудиторської діяльності №4808</h3><p>Дата внесення реєстрової інформації до Реєстру аудиторів та суб’єктів аудиторської діяльності — 04.07.2019.</p><p>Включено до розділу «Суб’єкти аудиторської діяльності, які мають право проводити обов’язковий аудит фінансової звітності» Реєстру аудиторів та суб’єктів аудиторської діяльності.</p></article><article><h3>Контроль якості</h3><p>Рішення Комітету з контролю якості аудиторських послуг АПУ щодо проходження перевірки системи контролю якості:</p><p><strong>28.11.2025 року №30/КЯ.</strong></p></article><article><h3>Страхування відповідальності</h3><p>Страхова сума — <strong>1 000 000 грн</strong>.<br/>АТ «СК «ББС ІНШУРАНС».</p><p>Договір №002-00833333/025ДВ від 17.08.2026.<br/>Період страхування: 05.09.2026–04.09.2027.</p></article></div></section>

<section class="section process"><div class="section-heading"><div><p class="eyebrow">ПОРЯДОК РОБОТИ</p><h2>Від завдання до результату</h2></div><p>Формат, строки й вартість визначаємо після ознайомлення з вашим запитом.</p></div><ol><li><b>Знайомимося</b><span>Обговорюємо завдання та вихідні дані.</span></li><li><b>Погоджуємо</b><span>Визначаємо обсяг, строки та умови роботи.</span></li><li><b>Працюємо</b><span>Вивчаємо документи, здійснюємо виїзд до клієнта.</span></li><li><b>Звітуємо</b><span>Передаємо погоджений результат і пояснюємо висновки.</span></li></ol></section>
<section class="section contact" data-section="contact"><div><p class="eyebrow">ПОЧНІМО З ВАШОГО ЗАВДАННЯ</p><h2>Обговоримо,<br/>чим можемо допомогти</h2><p>Залиште контакт і коротко опишіть питання. Це допоможе визначити наступний крок.</p><span class="contact-location">Суми · Україна</span></div><form><label>Ваше ім’я<input autocomplete="off" name="name" placeholder="Як до вас звертатися" required=""/></label><label>Телефон або email<input autocomplete="off" name="contact" placeholder="Зручний спосіб зв’язку" required=""/></label><label>Ваше завдання<textarea name="task" placeholder="Послуга, період, бажані строки" rows="3"></textarea></label><button class="action" type="submit">Отримати пропозицію ↗</button><p aria-live="polite" class="form-note">Демонстраційна форма — дані не надсилаються.</p></form></section>

<script>
(()=>{
const offerings=[
{id:'audit',group:'АУДИТ І ПЕРЕВІРКИ',title:'Обов’язковий та ініціативний аудит фінансової звітності',intro:'Незалежна перевірка фінансової звітності для виконання вимог до її аудиту або за рішенням власників і керівництва.',audience:'Підприємствам, які потребують обов’язкового аудиту, а також власникам, керівникам та інвесторам, яким потрібна незалежна думка щодо фінансової звітності.',work:['Ознайомлення з діяльністю, обліковою політикою та системою внутрішнього контролю.','Оцінка ризиків суттєвого викривлення й планування аудиторських процедур.','Перевірка суттєвих показників звітності та розкриттів, отримання аудиторських доказів.','Обговорення виявлених питань із керівництвом і формування аудиторського звіту.'],result:'Аудиторський звіт із незалежною думкою щодо фінансової звітності. Зміст думки визначається результатами аудиту та отриманими доказами.',inputs:['Звітний період і мета аудиту.','Фінансова звітність та інформація про застосовану основу її складання.','Короткі відомості про діяльність, обсяг операцій і бажаний строк.','Попередній аудиторський звіт, якщо він є.'],q:'Чи можна замовити аудит за власним рішенням?',a:'Так. Ініціативний аудит проводиться за погодженим завданням. До початку роботи визначаємо звітність, період і користувачів аудиторського звіту.'},
{id:'diia',group:'АУДИТ І ПЕРЕВІРКИ',title:'Перевірка звітів резидентів Дія.City',intro:'Допомагаємо підготуватися до незалежної перевірки звіту про відповідність і організувати роботу з підтвердними документами.',audience:'Резидентам Дія.City, які готують звіт про відповідність і потребують незалежного висновку аудитора. Фірма має досвід виконання таких завдань.',work:['Узгодження звітного періоду, предмета перевірки та вимог до завдання.','Ознайомлення зі звітом про відповідність і джерелами його показників.','Перевірка розрахунків та підтвердних документів у межах завдання.','Обговорення виявлених розбіжностей і підготовка незалежного висновку.'],result:'Незалежний висновок щодо звіту про відповідність у межах погодженого завдання. Висновки ґрунтуються на результатах перевірки.',inputs:['Період звіту та дата набуття статусу резидента.','Проєкт звіту про відповідність.','Розрахунки показників і документи, що їх підтверджують.','Строк, до якого потрібен висновок.'],q:'Чи потрібно чекати завершення підготовки звіту, щоб звернутися?',a:'Ні. Попередньо можна погодити перелік даних, графік і порядок взаємодії. Перевірку та висновок формуємо на підставі належних документів і остаточного предмета завдання.'},
{id:'grant',group:'АУДИТ І ПЕРЕВІРКИ',title:'Перевірка дотримання умов грантових угод',intro:'Перевіряємо використання грантових коштів і звітність відповідно до умов конкретної угоди та завдання донора.',audience:'Громадським і неприбутковим організаціям, медичним та навчальним закладам, іншим отримувачам грантів. Маємо досвід проєктів, зокрема за підтримки Міжнародного Вишеградського фонду та Українського культурного фонду.',work:['Вивчення грантової угоди, бюджету та технічного завдання донора.','Перевірка витрат, первинних документів, платежів і їх відображення в обліку.','Перевірка дотримання погоджених вимог до витрат та процедур проєкту.','Зіставлення фінансового звіту з підтвердними даними й підготовка звіту за завданням.'],result:'Звіт у форматі, визначеному умовами завдання. Залежно від вимог це може бути завдання з надання впевненості або виконання узгоджених процедур.',inputs:['Грантова угода з додатками та бюджетом.','Вимоги донора до перевірки і звіту.','Фінансовий звіт проєкту та перелік витрат.','Період перевірки, мова звіту та крайній строк.'],q:'Чи підходить один формат перевірки для всіх грантів?',a:'Формат визначаємо за угодою і вимогами донора. Тому до погодження вартості просимо надати технічне завдання або відповідний розділ грантової угоди.'},
{id:'review',group:'АУДИТ І ПЕРЕВІРКИ',title:'Огляд фінансової звітності',intro:'Завдання з надання обмеженої впевненості щодо фінансової звітності для погоджених потреб її користувачів.',audience:'Власникам, керівникам та іншим користувачам звітності, для яких прийнятний формат огляду, зокрема щодо проміжного звітного періоду.',work:['Уточнення мети огляду, складу звітності та основи її підготовки.','Запити до керівництва й аналітичне опрацювання фінансової інформації.','Дослідження питань, що потребують додаткових пояснень або процедур.','Оцінка результатів та складання звіту з огляду.'],result:'Звіт з огляду фінансової звітності з висновком у форматі обмеженої впевненості.',inputs:['Фінансова звітність за відповідний період.','Порівняльні дані та облікова політика.','Мета огляду й вимоги отримувача звіту.','Бажаний строк завершення.'],q:'Чи замінює огляд обов’язковий аудит?',a:'Огляд і аудит мають різний обсяг процедур та рівень впевненості. Якщо потрібен саме обов’язковий аудит, для такого завдання обираємо аудит фінансової звітності.'},
{id:'procedures',group:'АУДИТ І ПЕРЕВІРКИ',title:'Узгоджені процедури',intro:'Перевірка конкретних даних, операцій або документів за заздалегідь погодженим переліком процедур.',audience:'Власникам, партнерам, грантоотримувачам та іншим замовникам, яким потрібні фактичні результати перевірки визначених питань.',work:['Визначення предмета, користувачів звіту та конкретного переліку процедур.','Погодження джерел даних, обсягу вибірки й порядку фіксації результатів.','Виконання процедур і документування встановлених фактів.','Підготовка звіту про виконані процедури та їх результати.'],result:'Звіт про узгоджені процедури та фактичні результати. Користувачі самостійно оцінюють наведені факти; аудиторська думка чи висновок із надання впевненості в такому звіті не висловлюються.',inputs:['Питання, які потрібно перевірити.','Перелік операцій, документів або показників.','Вимоги отримувача звіту, якщо є.','Період і бажаний обсяг перевірки.'],q:'Чи можна перевірити лише одну ділянку обліку?',a:'Так. Наприклад, окремі розрахунки, витрати або виконання визначених умов. Важливо до початку роботи точно погодити процедури та доступні джерела інформації.'},
{id:'ifrs',group:'ЗВІТНІСТЬ І ПОДАТКИ',title:'Трансформація фінансової звітності за МСФЗ',intro:'Перехід від звітності за НП(С)БО до повного комплекту фінансової звітності за МСФЗ, включно з примітками.',audience:'Підприємствам, які переходять на МСФЗ або готують звітність за міжнародними стандартами для власників, інвесторів чи інших користувачів.',work:['Аналіз вихідних даних і відмінностей між застосованим обліком та МСФЗ.','Погодження облікових підходів і переліку необхідних розрахунків.','Підготовка трансформаційних коригувань і робочих таблиць.','Формування комплекту фінансової звітності та приміток, обговорення з керівництвом.'],result:'Повний комплект фінансової звітності за МСФЗ із примітками та погоджені трансформаційні розрахунки. За вихідні дані, управлінські оцінки й затвердження звітності відповідає керівництво.',inputs:['Звітність за НП(С)БО та оборотно-сальдові відомості.','Облікова політика, аналітика активів і зобов’язань.','Інформація про перше застосування МСФЗ та порівняльні періоди.','Вимоги до звітності й бажаний строк.'],q:'Чи включені примітки до звітності?',a:'Так, передбачаємо повний комплект із примітками. Потребу в оцінках, актуарних розрахунках чи інших спеціалізованих даних визначаємо після аналізу підприємства та погоджуємо окремо.'},
{id:'tp',group:'ЗВІТНІСТЬ І ПОДАТКИ',title:'Трансфертне ціноутворення — ТЦУ',intro:'Аналіз операцій, підготовка документації та звітності з трансфертного ціноутворення відповідно до завдання клієнта.',audience:'Компаніям з операціями, які потребують аналізу для цілей ТЦУ, підготовки документації або супроводу питань щодо контрольованих операцій.',work:['Аналіз операцій і контрагентів для визначення обсягу робіт із ТЦУ.','Функціональний аналіз, вибір методу та дослідження зіставності.','Економічний аналіз і підготовка документації в погодженому обсязі.','Підготовка звітності та супровід запитів щодо ТЦУ за окремо визначеним завданням.'],result:'Погоджений комплект аналітичних матеріалів, документації та/або звітності з поясненням застосованого підходу та виявлених ризиків.',inputs:['Звітний рік, фінансові показники та перелік контрагентів.','Реєстр операцій, договори й первинні документи.','Облікова аналітика та попередня документація, якщо є.','Запити контролюючого органу, якщо завдання пов’язане з ними.'],q:'Чи можна замовити лише документацію або перевірку звіту?',a:'Так. Обсяг може охоплювати весь комплекс або окрему частину роботи. Джерела зіставних даних і потребу в платних базах визначаємо та погоджуємо під конкретне завдання.'},
{id:'cfc',group:'ЗВІТНІСТЬ І ПОДАТКИ',title:'Контрольовані іноземні компанії — КІК',intro:'Допомога з аналізом іноземних структур, підготовкою розрахунків і звітності щодо КІК.',audience:'Фізичним та юридичним особам, які володіють іноземними компаніями або контролюють їх і потребують визначення та виконання відповідних обов’язків.',work:['Аналіз структури володіння, контролю й обставин клієнта.','Визначення складу необхідних документів і звітності.','Опрацювання фінансової інформації іноземної компанії та розрахунків.','Підготовка погоджених повідомлень, звітів і пояснень; супровід запитів у межах завдання.'],result:'Висновки щодо проаналізованих питань і погоджений комплект розрахунків та документів для виконання обов’язків стосовно КІК.',inputs:['Країна реєстрації та структура володіння компанією.','Відомості про частки, контроль і їх зміни.','Фінансова звітність іноземної компанії.','Попередні подані документи та період, який потрібно опрацювати.'],q:'Чи можна звернутися до отримання фінансової звітності іноземної компанії?',a:'Так. Почнемо з аналізу структури та переліку потрібних даних. Обсяг подальших розрахунків і підготовки звітності визначимо з урахуванням наданої інформації.'},
{id:'tax',group:'ЗВІТНІСТЬ І ПОДАТКИ',title:'Податкове консультування та перевірка податкових ризиків',intro:'Допомагаємо розібратися з податковими наслідками операцій і визначити питання, що потребують уваги.',audience:'Підприємствам та організаціям, які планують операцію, мають складне податкове питання або хочуть перевірити певну ділянку обліку й звітності.',work:['Уточнення обставин операцій і предмета консультації.','Аналіз договорів, первинних документів та податкового обліку.','Виявлення ризиків і можливих варіантів їх врегулювання.','Підготовка пояснень та рекомендацій із погоджених питань.'],result:'Усна або письмова консультація чи звіт за результатами перевірки — залежно від замовленого формату. Рекомендації ґрунтуються на наданих документах і встановлених обставинах.',inputs:['Опис питання або операції.','Договори й документи, що пояснюють ситуацію.','Відповідні облікові дані та звітність.','Період і потрібний формат відповіді.'],q:'Чи можна перевірити ризики до проведення операції?',a:'Так. Для попереднього аналізу надайте проєкт договору, опис розрахунків та очікувані умови. Висновки уточнюються, якщо фактичні умови змінюються.'},
{id:'due',group:'КОНТРОЛЬ І ПРАВНИЧА ДОПОМОГА',title:'Перевірка бізнесу перед придбанням або інвестуванням',intro:'Фінансова, податкова та юридична перевірка бізнесу — Due Diligence — для обґрунтованого рішення щодо угоди.',audience:'Покупцям підприємств або часток, інвесторам і партнерам, які хочуть зрозуміти фінансовий стан бізнесу, його зобов’язання та ризики до укладення угоди.',work:['Уточнення структури майбутньої угоди та пріоритетних питань покупця.','Аналіз звітності, активів, боргів, доходів і витрат у погодженому обсязі.','Дослідження податкових ризиків, ключових договорів і правових питань.','Формування переліку суттєвих ризиків, невирішених питань та рекомендацій.'],result:'Звіт із висновками щодо перевірених питань і ризиків, які варто врахувати в рішенні про угоду та її умовах.',inputs:['Опис бізнесу й запланованої угоди.','Періоди та питання, які потрібно перевірити.','Перелік доступних фінансових і юридичних документів.','Строк прийняття рішення та порядок доступу до інформації.'],q:'Чи визначає ця перевірка вартість бізнесу?',a:'Її основне завдання — дослідити стан бізнесу й ризики угоди. Незалежна оцінка вартості не входить автоматично до Due Diligence; склад фінансового аналізу погоджуємо до початку роботи.'},
{id:'internal',group:'КОНТРОЛЬ І ПРАВНИЧА ДОПОМОГА',title:'Внутрішній аудит і оцінка системи внутрішнього контролю',intro:'Аналіз процесів і контрольних процедур, щоб керівництво розуміло слабкі місця та способи їх усунення.',audience:'Власникам і керівникам підприємств, які прагнуть перевірити окремий процес, розподіл повноважень або дієвість внутрішніх контролів.',work:['Визначення процесів і ризиків, що входять до завдання.','Вивчення регламентів, відповідальності та фактичного порядку роботи.','Перевірка погоджених контрольних процедур на вибраних операціях.','Опис недоліків і підготовка практичних рекомендацій.'],result:'Звіт із виявленими недоліками контролю, їх можливими наслідками й рекомендаціями щодо вдосконалення процесів.',inputs:['Мета перевірки та перелік процесів.','Організаційна структура й внутрішні регламенти.','Опис проблем або ризиків, які турбують керівництво.','Приклади операцій і відомості про облікові системи.'],q:'Чи можна почати з одного процесу?',a:'Так. Наприклад, із закупівель, розрахунків із контрагентами або обліку запасів. Це дозволяє визначити конкретні межі завдання й відповідальних за взаємодію.'},
{id:'inspection',group:'КОНТРОЛЬ І ПРАВНИЧА ДОПОМОГА',title:'Супровід податкових перевірок',intro:'Професійна підтримка під час підготовки, проведення перевірки та опрацювання її результатів.',audience:'Підприємствам і організаціям, які отримали повідомлення чи запит, проходять податкову перевірку або потребують допомоги після отримання її матеріалів.',work:['Вивчення предмета, періоду й наявних матеріалів перевірки.','Аналіз облікових даних та документального підтвердження операцій.','Допомога з підготовкою відповідей, пояснень і пакета документів.','Опрацювання акта перевірки та підготовка позиції й заперечень у погодженому обсязі.'],result:'Погоджений пакет пояснень, документів або заперечень, а також рекомендації щодо подальших дій за конкретною ситуацією.',inputs:['Повідомлення, наказ, запит або акт перевірки.','Дата отримання документів і встановлені строки реагування.','Опис спірних питань та попереднє листування.','Облікові дані за відповідними операціями.'],q:'Чи можна залучити вас, коли перевірка вже триває?',a:'Так. Повідомте поточний етап і найближчі строки, щоб ми могли оцінити обсяг термінових дій. Представництво та оскарження погоджуються відповідно до конкретного завдання.'},
{id:'legal',group:'КОНТРОЛЬ І ПРАВНИЧА ДОПОМОГА',title:'Представництво в судах і контролюючих органах',intro:'Правнича допомога з урахуванням юридичних обставин, фінансових документів і податкових питань справи.',audience:'Бізнесу та організаціям, які потребують захисту інтересів у спорі, оскарження рішення або представництва у взаємодії з контролюючим органом.',work:['Аналіз обставин, документів і поточного стану справи.','Визначення правової позиції та можливих варіантів дій.','Підготовка погоджених заяв, скарг, заперечень та інших документів.','Представництво й супровід відповідних процедур у межах погоджених повноважень.'],result:'Підготовлені документи та правнича допомога на погодженому етапі справи. Перспективи й ризики обговорюються після аналізу матеріалів.',inputs:['Короткий виклад обставин і бажаний результат.','Рішення, претензії, позови або інші матеріали справи.','Дати отримання документів і найближчі строки.','Договори та докази, що стосуються спору.'],q:'Чи можна замовити допомогу лише на одному етапі?',a:'Так. Обсяг може включати аналіз перспектив, підготовку окремого документа або представництво на визначеному етапі. Умови взаємодії погоджуємо залежно від завдання.'}
];
const protection={
id:'protection',group:'КОНТРОЛЬ І ПРАВНИЧА ДОПОМОГА',title:'Захист та представництво',
intro:'Допомога у взаємодії з податковими та іншими контролюючими органами: від опрацювання першого запиту й підготовки до перевірки до заперечень, оскарження рішень і представництва в суді.',
audience:'Підприємствам, підприємцям та організаціям, які отримали запит або повідомлення про перевірку, вже проходять перевірку, не погоджуються з її висновками чи потребують захисту інтересів у спорі. Можна звернутися як до початку перевірки, так і на окремому етапі її проведення або оскарження результатів.',
work:[
'Первинний аналіз ситуації. Вивчаємо отримані запити, повідомлення, накази, акти та рішення, предмет перевірки, наявні документи й строки реагування. Визначаємо питання, які потребують першочергових дій.',
'Підготовка до податкової перевірки. Аналізуємо облікові дані, звітність і документальне підтвердження операцій у погодженому обсязі. Виявляємо спірні питання, формуємо перелік потрібних документів та погоджуємо порядок взаємодії з відповідальними працівниками клієнта.',
'Супровід податкових перевірок. Опрацьовуємо запити перевіряльників, допомагаємо підготувати пояснення й документи, аналізуємо питання, що виникають у процесі перевірки. Участь у зустрічах, виїзд до клієнта та представництво погоджуємо відповідно до завдання.',
'Супровід перевірок інших контролюючих органів. Вивчаємо предмет і межі конкретної перевірки, готуємо позицію клієнта, відповіді та документальні підтвердження. Формат участі й обсяг допомоги визначаємо після ознайомлення з матеріалами.',
'Опрацювання результатів перевірки. Аналізуємо акт, наведені порушення, розрахунки та докази. Спільно з клієнтом уточнюємо фактичні обставини, готуємо заперечення, пояснення й підтвердні матеріали.',
'Оскарження рішень контролюючих органів. Оцінюємо можливі способи захисту, перспективи та ризики, готуємо скарги й інші необхідні документи та супроводжуємо їх розгляд у межах погодженого завдання.',
'Представництво в судах і контролюючих органах. Формуємо правову позицію, систематизуємо докази, готуємо процесуальні документи, представляємо інтереси на погоджених стадіях справи та пояснюємо клієнту результати й подальші можливі дії.'
],
result:'Ви отримуєте обґрунтовану позицію щодо своєї ситуації, погоджений план дій та підготовлені для відповідного етапу документи: відповіді на запити, пояснення, заперечення, скарги або процесуальні документи. Якщо завдання передбачає супровід чи представництво, забезпечуємо участь на погоджених етапах та інформуємо про перебіг справи. Конкретний склад результатів, строки й межі повноважень визначаємо в договорі після аналізу матеріалів.',
inputs:['Назва контролюючого органу, предмет питання та поточний етап перевірки або спору.','Отримані запити, повідомлення, накази, акти, рішення чи судові документи.','Дати отримання документів, відомі строки та попереднє листування.','Короткий опис обставин, наявні докази, облікові документи та очікуваний обсяг допомоги.'],
q:'Чи можна замовити лише відповідь на запит або супровід окремого етапу?',
a:'Так. Завдання може охоплювати консультацію, аналіз документів, підготовку відповіді чи заперечень, супровід конкретної перевірки або представництво на визначеній стадії спору. Спочатку з’ясовуємо обставини та строки, після чого погоджуємо потрібний обсяг роботи.'
};
offerings.push(protection);

const root=document.getElementById('mriya-projects'),site=root.querySelector('.site'),home=site.querySelector('main');
site.insertBefore(document.getElementById('mriya-service-page').content.cloneNode(true),site.querySelector('footer'));
const page=site.querySelector('.service-page');let current=null;let previousServiceTitle='';
const processList=page.querySelector('.service-editorial ol');
const usualSteps=[...processList.children].map(li=>li.textContent);
const protectionSteps=[
'З’ясовуємо ситуацію та строки. Ви передаєте наявні документи; ми визначаємо поточний етап, найближчі строки та питання, що потребують термінової уваги.',
'Погоджуємо завдання. Визначаємо обсяг допомоги, відповідальних осіб, формат участі, порядок обміну документами, строки та вартість.',
'Аналізуємо матеріали й формуємо позицію. Зіставляємо обставини з документами, уточнюємо питання у клієнта, визначаємо докази та обговорюємо можливі варіанти дій.',
'Готуємо документи та супроводжуємо погоджений етап. Опрацьовуємо запити, пояснення та матеріали перевірки; за умовами завдання беремо участь у взаємодії з контролюючим органом або в судовій справі.',
'Обговорюємо результати та наступні дії. Передаємо підготовлені документи, пояснюємо отримані рішення й подальші можливості. Якщо потрібен наступний етап захисту, окремо погоджуємо його обсяг.'
];
const related=document.createElement('section');
const relatedTitle=document.createElement('h2');relatedTitle.textContent='Докладніше про послуги';related.append(relatedTitle);
for(const [id,label] of [['inspection','Супровід податкових перевірок ↗'],['legal','Представництво в судах і контролюючих органах ↗']]){const b=document.createElement('button');b.type='button';b.className='service-link';b.dataset.service=id;b.textContent=label;related.append(b);}
page.querySelector('.service-editorial').append(related);related.hidden=true;

const set=(sel,text)=>page.querySelector(sel).textContent=text;
const list=(sel,items)=>{const ul=page.querySelector(sel);ul.replaceChildren(...items.map(t=>{const li=document.createElement('li');li.textContent=t;return li;}));};
function showService(i){current=offerings[i];set('.service-category',current.group);set('.service-title',current.title);set('.service-intro',current.intro);set('.service-audience',current.audience);set('.service-result',current.result);set('.service-question',current.q);set('.service-answer',current.a);list('.service-work',current.work);list('.service-inputs',current.inputs);list('.service-editorial ol',current.id==='protection'?protectionSteps:usualSteps);related.hidden=current.id!=='protection';home.hidden=true;page.hidden=false;site.querySelector('.mobile-menu').open=false;page.scrollIntoView({block:'start',behavior:'instant'});}
function showHome(section){page.hidden=true;home.hidden=false;site.querySelector('.mobile-menu').open=false;const target=site.querySelector('[data-section="'+section+'"]');if(target)target.scrollIntoView({block:'start',behavior:'instant'});}
home.querySelectorAll('.service-group details').forEach((d,i)=>{const button=document.createElement('button');button.type='button';button.className='service-link';button.textContent=d.querySelector('summary').textContent+' ↗';button.dataset.detail=String(i);d.replaceWith(button);});
site.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.hasAttribute('data-detail')){e.preventDefault();e.stopImmediatePropagation();showService(Number(b.dataset.detail));page.querySelector('.service-back').focus({preventScroll:true});}else if(b.hasAttribute('data-service')){e.preventDefault();e.stopImmediatePropagation();const i=offerings.findIndex(o=>o.id===b.dataset.service);if(i>=0){showService(i);page.querySelector('.service-back').focus({preventScroll:true});}}else if(b.classList.contains('service-back')){e.preventDefault();e.stopImmediatePropagation();const i=offerings.indexOf(current);showHome('services');const origin=home.querySelector('[data-detail="'+i+'"]');if(origin)origin.focus({preventScroll:true});}else if(b.classList.contains('service-inquiry')){e.preventDefault();e.stopImmediatePropagation();const field=home.querySelector('textarea');if(!field.value.trim()||field.value===previousServiceTitle){field.value=current?current.title:'';previousServiceTitle=field.value;}showHome('contact');home.querySelector('input[name="name"]').focus({preventScroll:true});}else if(b.hasAttribute('data-go')){e.preventDefault();e.stopImmediatePropagation();showHome(b.dataset.go);}},true);

root.dataset.serviceCount=String(offerings.length);
})();
</script>
